server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: activator
  datasource:
    url: ${POSTGRES_URL_DEV}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

